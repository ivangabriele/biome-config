name: Release

on: workflow_dispatch

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version: 24
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          git_config_global: true
          git_commit_gpgsign: true
          git_committer_name: 'Ivan Gabriele (Github)'
          git_committer_email: ivan.gabriele+github@protonmail.com
          git_user_signingkey: true
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          trust_level: ultimate
      - name: Release
        run: pnpm semantic-release
        env:
          GIT_AUTHOR_NAME: 'Ivan Gabriele (Github)'
          GIT_AUTHOR_EMAIL: ivan.gabriele+github@protonmail.com
          GIT_COMMITTER_NAME: 'Ivan Gabriele (Github)'
          GIT_COMMITTER_EMAIL: ivan.gabriele+github@protonmail.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
